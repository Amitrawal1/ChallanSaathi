name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU-only torch)
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests app
          ruff format --check src tests app
      - name: Test
        run: pytest
