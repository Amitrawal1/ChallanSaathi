[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "challansaathi"
version = "0.1.0"
description = "Indian Motor Vehicle Law assistant using hybrid (vector + BM25) retrieval-augmented generation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=5.0,<7",
    "numpy>=1.26,<3",
    "faiss-cpu>=1.8,<2",
    "sentence-transformers>=3.0,<7",
    "rank-bm25>=0.2.2,<0.3",
    "ollama>=0.4,<1",
]

[project.optional-dependencies]
app = ["streamlit>=1.35,<2"]
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
dev = ["pytest>=8.0,<10", "ruff>=0.6,<1", "pre-commit>=3.7,<5", "httpx>=0.27,<1"]

[project.scripts]
challansaathi = "challansaathi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]  # archived prototype, kept for reference
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
