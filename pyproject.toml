[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "challansaathi"
version = "0.1.0"
description = "Indian Motor Vehicle Law assistant using hybrid (vector + BM25) retrieval-augmented generation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=4.0",
    "numpy>=1.26",
    "faiss-cpu>=1.8",
    "sentence-transformers>=2.7",
    "rank-bm25>=0.2.2",
    "langchain-text-splitters>=0.2",
    "ollama>=0.3",
]

[project.optional-dependencies]
app = ["streamlit>=1.35"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
challansaathi = "challansaathi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
